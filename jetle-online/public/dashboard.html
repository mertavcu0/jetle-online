<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panelim | jetle.online</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }

    .navbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 150px minmax(320px, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .logo {
      color: #2563eb;
      font-size: 24px;
      font-weight: 900;
    }

    .logo span {
      color: #111827;
    }

    .search {
      display: flex;
      min-width: 0;
    }

    .search input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #d1d5db;
      border-right: 0;
      border-radius: 8px 0 0 8px;
      background: #f9fafb;
      outline: none;
    }

    .search button {
      height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: 0 8px 8px 0;
      background: #2563eb;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-right,
    #authArea {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    #authArea a,
    #authArea button,
    .post-btn {
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    #authArea button {
      border: 1px solid #d1d5db;
      background: #fff;
      color: #374151;
    }

    .user-email {
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 700;
    }

    .post-btn {
      background: #2563eb;
      color: #fff;
    }

    .dashboard-shell {
      max-width: 1180px;
      margin: 20px auto;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 18px;
      align-items: start;
    }

    .sidebar,
    .content-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .sidebar {
      position: sticky;
      top: 76px;
      padding: 16px;
    }

    .sidebar h3 {
      margin: 0 0 14px;
      color: #111827;
      font-size: 17px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 8px;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .menu-icon,
    .meta-icon {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 16px;
      color: currentColor;
    }

    .menu-icon svg,
    .meta-icon svg {
      width: 16px;
      height: 16px;
      display: block;
      stroke: currentColor;
    }

    .menu-item.active,
    .menu-item:hover {
      background: #f3f4f6;
      color: #1d4ed8;
    }

    .content-card {
      padding: 16px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-head h1 {
      margin: 0;
      font-size: 20px;
    }

    .muted {
      color: #6b7280;
      font-size: 13px;
      line-height: 1.55;
    }

    .chat-list {
      display: grid;
      gap: 12px;
    }

    .msg-card {
      display: grid;
      gap: 8px;
      padding: 14px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .msg-card:hover {
      transform: translateY(-1px);
      border-color: #dbe2ea;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }

    .msg-card > div {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .msg-card b {
      display: block;
      font-size: 14px;
      line-height: 1.4;
      color: #111827;
    }

    .msg-card small {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.45;
      color: #6b7280;
    }

    .msg-card p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: #374151;
    }

    .msg-card span {
      font-size: 12px;
      line-height: 1.4;
      color: #6b7280;
      white-space: nowrap;
      justify-self: end;
    }

    .listing-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .listing-card {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      min-width: 0;
    }

    .listing-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(15,23,42,0.08);
      border-color: #dbe2ea;
    }

    .listing-card img {
      width: 160px;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      background: #e5e7eb;
      display: block;
    }

    .listing-info {
      min-width: 0;
      display: block !important;
      gap: 8px;
      align-content: center;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .listing-info h4 {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
      color: #111827;
      word-break: break-word;
    }

    .listing-price {
      margin: 0;
      color: #1d4ed8;
      font-size: 20px;
      font-weight: 900;
    }

    .listing-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      color: #6b7280;
      font-size: 13px;
    }

    .listing-meta span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      font-weight: 600;
    }

    .listing-status {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 800;
      width: fit-content;
    }

    .listing-status.pending {
      background: #fff7ed;
      color: #c2410c;
    }

    .listing-status.approved,
    .listing-status.active {
      background: #ecfdf5;
      color: #047857;
    }

    .listing-status.inactive {
      background: #f3f4f6;
      color: #4b5563;
    }

    .listing-status.suspicious {
      background: #fef2f2;
      color: #b91c1c;
    }

    .listing-actions {
      display: flex !important;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
      justify-self: end;
      min-width: 120px;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .listing-actions a,
    .listing-actions button {
      min-width: 120px;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      text-align: center;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-view {
      background: #f1f3f5;
      color: #374151;
    }

    .btn-edit {
      background: #e7f5ff;
      color: #1c7ed6;
    }

    .btn-delete {
      background: #fff5f5;
      color: #e03131;
    }

    .listing-actions a:hover,
    .listing-actions button:hover {
      transform: translateY(-1px);
      filter: brightness(0.98);
    }

    .empty-state {
      padding: 42px 16px;
      border: 1px dashed #d1d5db;
      border-radius: 10px;
      background: #f9fafb;
      color: #6b7280;
      text-align: center;
    }

    .empty-state h4 {
      margin: 0 0 6px;
      color: #111827;
      font-size: 17px;
    }

    .empty-state p {
      margin: 0 0 14px;
    }

    .empty-state button {
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .placeholder {
      display: none;
      padding: 42px 16px;
      color: #6b7280;
      text-align: center;
    }

    @media (max-width: 900px) {
      .navbar-inner,
      .dashboard-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }
    }

    @media (max-width: 640px) {
      .listing-card {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .listing-card img {
        width: 100%;
        height: 190px;
      }

      .listing-actions {
        justify-self: stretch;
        min-width: 0;
      }

      .listing-actions a,
      .listing-actions button {
        width: 100%;
        min-width: 0;
      }

      .nav-right {
        flex-wrap: wrap;
      }
    }

    @media (max-width: 768px) {
      .navbar-inner {
        grid-template-columns: 1fr;
      }

      .search {
        width: 100%;
      }

      .nav-right,
      #authArea {
        width: 100%;
        flex-wrap: wrap;
        justify-content: flex-start;
        white-space: normal;
      }

      .post-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="/index.html">jetle<span>.online</span></a>
      <form class="search" action="/listings.html" method="get">
        <input type="text" name="search" placeholder="Kelime, ilan no veya kategori ara">
        <button type="submit">Ara</button>
      </form>
      <div class="nav-right">
        <div id="authArea"></div>
        <a href="/create-listing.html" class="post-btn">İlan Ver</a>
      </div>
    </div>
  </header>

  <main class="dashboard-shell">
    <aside class="sidebar">
      <h3>Hesabım</h3>
      <a href="/dashboard.html" class="menu-item active">Benim İlanlarım</a>
      <a href="/create-listing.html" class="menu-item">Yeni İlan Ver</a>
      <a href="/messages.html" class="menu-item"><span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10h10"/><path d="M7 14h6"/><path d="M21 12c0 4.418-4.03 8-9 8a9.94 9.94 0 0 1-4.255-.95L3 20l1.255-4.18A7.5 7.5 0 0 1 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8Z"/></svg></span> Mesajlar</a>
      <a href="/favorites.html" class="menu-item"><span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.716-4.35-9.193-8.115C.516 9.4 2.275 5 6.407 5c2.182 0 3.593 1.34 4.37 2.535C11.554 6.34 12.965 5 15.147 5c4.132 0 5.891 4.4 3.6 7.885C18.716 16.65 12 21 12 21Z"/></svg></span> Favoriler</a>
      <a href="/account.html" class="menu-item"><span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4 20a8 8 0 0 1 16 0"/><path d="m19.4 15 .9.6.9-.6.9 1.56-.9.54v1.08l.9.54-.9 1.56-.9-.6-.9.6-.9-1.56.9-.54V17.1l-.9-.54Z"/></svg></span> Hesap Ayarları</a>
    </aside>

    <section class="content-card" id="listingsPanel">
      <div class="section-head">
        <div>
          <h1>Benim İlanlarım</h1>
          <p class="muted">Yayınladığın ilanları burada takip edebilirsin.</p>
        </div>
      </div>
      <div id="myListingsGrid" class="listing-grid" data-dashboard-managed="inline"></div>
    </section>

    <section class="content-card placeholder" id="messagesPanel">
      <h1>Mesajlar</h1>
      <p>İlan sahipleriyle yaptığınız görüşmeler burada görünür.</p>
    </section>
  </main>

  <script src="/auth-global.js"></script>
  <script src="/dashboard.js"></script>
  <script>
    (function () {
      const grid = document.getElementById("myListingsGrid");
      if (!grid) return;

      const originalLoadSection = typeof window.loadSection === "function"
        ? window.loadSection
        : null;

      function getDashboardToken() {
        return String(localStorage.getItem("token") || "").trim();
      }

      function getDashboardUser() {
        try {
          return JSON.parse(localStorage.getItem("user") || "{}");
        } catch (_) {
          return {};
        }
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function listingImage(listing) {
        if (listing.image && String(listing.image).trim()) return listing.image;
        if (Array.isArray(listing.images) && listing.images[0]) return listing.images[0];
        return "https://picsum.photos/400/300";
      }

      function formatPrice(price) {
        return new Intl.NumberFormat("tr-TR").format(Number(price || 0)) + " TL";
      }

      function formatStatus(status) {
        const safe = String(status || "inactive").toLowerCase();
        const map = {
          pending: "Beklemede",
          approved: "Onaylı",
          suspicious: "Şüpheli",
          inactive: "Pasif",
          active: "Aktif"
        };
        return { key: safe, label: map[safe] || "Pasif" };
      }

      function iconMapPin() {
        return '<span class="meta-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6-5.686 6-11a6 6 0 1 0-12 0c0 5.314 6 11 6 11Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg></span>';
      }

      function iconFolder() {
        return '<span class="meta-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-10Z"></path></svg></span>';
      }

      function bindAuthAreaActions() {
        const logoutBtn = document.querySelector("#authArea .logout-btn");
        if (!logoutBtn || logoutBtn.dataset.bound === "true") return;

        logoutBtn.removeAttribute("onclick");
        logoutBtn.dataset.bound = "true";
        logoutBtn.addEventListener("click", () => {
          localStorage.removeItem("token");
          localStorage.removeItem("user");
          window.location.href = "/login.html";
        });
      }

      function bindListingActions() {
        if (!grid || grid.dataset.bound === "true") return;

        grid.dataset.bound = "true";
        grid.addEventListener("click", (event) => {
          const actionBtn = event.target.closest("[data-action]");
          if (actionBtn) {
            event.preventDefault();
            event.stopPropagation();

            const listingId = actionBtn.dataset.listingId || "";
            const action = actionBtn.dataset.action || "";

            if (action === "create") {
              window.location.href = "/create-listing.html";
              return;
            }

            if (!listingId) return;

            if (action === "edit") {
              editListing(listingId);
              return;
            }

            if (action === "view") {
              viewListing(listingId);
              return;
            }

            if (action === "delete") {
              deleteListing(listingId);
              return;
            }
          }

          const card = event.target.closest(".listing-card[data-listing-id]");
          if (!card) return;
          viewListing(card.dataset.listingId || "");
        });
      }

      function renderManagedListingCard(listing) {
        const status = formatStatus(listing.status);
        const id = String(listing._id || listing.id || "");
        const locationBits = [listing.city, listing.district].filter(Boolean).join(" / ");
        const categoryBits = [listing.category, listing.subCategory].filter(Boolean).join(" / ");
        const title = escapeHtml(String(listing.title || "Ba\u015fl\u0131ks\u0131z ilan"));
        const price = escapeHtml(formatPrice(listing.price));
        const statusLabel = escapeHtml(status.label || "Pasif");

        return `
          <article class="listing-card" data-listing-id="${escapeHtml(id)}" data-test="managed-card">
            <img src="${escapeHtml(listingImage(listing))}" alt="${escapeHtml(listing.title || "\u0130lan")}" loading="lazy">
            <div class="listing-info" style="display:block;visibility:visible;opacity:1;">
              <h4 style="display:block;visibility:visible;opacity:1;">${title}</h4>
              <div class="listing-price" style="display:block;visibility:visible;opacity:1;">${price}</div>
              <div class="listing-meta" style="display:flex;visibility:visible;opacity:1;">
                <span>${iconMapPin()}${escapeHtml(locationBits || "Konum yok")}</span>
                <span>${iconFolder()}${escapeHtml(categoryBits || "Kategori yok")}</span>
              </div>
              <span class="listing-status ${status.key}" style="display:inline-flex;visibility:visible;opacity:1;">${statusLabel}</span>
            </div>
            <div class="listing-actions" style="display:flex;visibility:visible;opacity:1;">
              <button type="button" class="btn-view" data-action="view" data-listing-id="${escapeHtml(id)}">Detay G\u00f6r</button>
              <button type="button" class="btn-edit" data-action="edit" data-listing-id="${escapeHtml(id)}">D\u00fczenle</button>
              <button type="button" class="btn-delete" data-action="delete" data-listing-id="${escapeHtml(id)}">Sil</button>
            </div>
          </article>
        `;
      }

      async function renderManagedListings() {
        const user = getDashboardUser();
        if (!user.email) return;
        if (grid.dataset.renderLock === "true") return;
        if (grid.dataset.renderComplete === "true") return;

        grid.dataset.renderLock = "true";
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">İlanlar yükleniyor...</div>
        `;

        try {
          const token = String(localStorage.getItem("token") || "").trim();
          if (!token) {
            window.location.href = "/login.html";
            return;
          }

          const res = await fetch("/api/listings/my-listings", {
            headers: {
              Authorization: `Bearer ${token}`
            }
          });
          const listings = await res.json();

          if (res.status === 401 || res.status === 403) {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "/login.html";
            return;
          }

          if (!res.ok || !Array.isArray(listings)) {
            throw new Error("listings_failed");
          }

          if (!listings.length) {
            if (grid.dataset.hasListings === "true") return;
            grid.innerHTML = `
              <div class="empty-state" style="grid-column: 1 / -1;">
                <h4>Henüz ilanınız yok</h4>
                <p>Hemen ilan vererek satışa başlayın.</p>
                <button type="button" data-action="create">İlan Ver</button>
              </div>
            `;
            grid.dataset.renderComplete = "true";
            return;
          }

          grid.dataset.hasListings = "true";
          grid.dataset.renderComplete = "true";
          grid.innerHTML = listings.map((listing) => renderManagedListingCard(listing)).join("");
        } catch (_) {
          if (grid.dataset.hasListings === "true") return;
          grid.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              İlanlar yüklenemedi. Lütfen tekrar deneyin.
            </div>
          `;
        } finally {
          grid.dataset.renderLock = "false";
        }
      }

            function getStoredMessageDraft() {
        try {
          return JSON.parse(localStorage.getItem("jetle_message_draft") || "null");
        } catch (_) {
          return null;
        }
      }

      function renderMessagesEmptyState(list) {
        if (!list) return;
        list.innerHTML = `
          <div class="empty-state">
            <h4>Henüz mesajınız yok.</h4>
            <p>İlan sahipleriyle yaptığınız görüşmeler burada görünür.</p>
          </div>
        `;
      }

      function normalizeConversationsPayload(data) {
        if (Array.isArray(data)) return data;
        if (Array.isArray(data?.conversations)) return data.conversations;
        if (Array.isArray(data?.items)) return data.items;
        return [];
      }

      window.loadSection = function loadSectionWithAuth(type) {
        if (type !== "messages") {
          if (originalLoadSection) return originalLoadSection(type);
          return;
        }

        const content = typeof window.dashboardContent === "function"
          ? window.dashboardContent()
          : document.getElementById("listingsPanel");

        if (!content) return;

        const token = getDashboardToken();
        if (!token) {
          content.innerHTML = `
            <h2>Mesajlarım</h2>
            <div class="empty-state">Mesajları görmek için giriş yapın.</div>
          `;
          return;
        }

        const user = getDashboardUser();
        const userKey = user.id || user._id || user.email;
        if (!userKey) {
          content.innerHTML = `
            <h2>Mesajlarım</h2>
            <div class="empty-state">Mesajları görmek için giriş yapın.</div>
          `;
          return;
        }

        content.innerHTML = `
          <h2>Mesajlarım</h2>
          <div class="chat-list">Mesajlar yükleniyor...</div>
        `;

        const list = content.querySelector(".chat-list");
        fetch(`/api/messages/conversations`, {
          headers: {
            Authorization: `Bearer ${token}`
          }
        })
          .then(async (res) => {
            const data = await res.json().catch(() => null);
            if (res.status === 401 || res.status === 403) {
              localStorage.removeItem("token");
              localStorage.removeItem("user");
              window.location.href = "/login.html";
              return null;
            }
            if (!res.ok) return null;
            return normalizeConversationsPayload(data);
          })
          .then((conversations) => {
            if (!list) return;
            if (!Array.isArray(conversations) || !conversations.length) {
              renderMessagesEmptyState(list);
              return;
            }

            list.innerHTML = conversations.map((conversation) => {
              const otherUser = conversation.otherUserName || conversation.otherUserEmail || "Kullanıcı";
              const body = conversation.lastMessage || "Henüz mesaj bulunmuyor.";
              const title = conversation.listingTitle || "İlan mesajı";
              const conversationId = conversation.conversationId || conversation.id || "";
              return `
                <a class="msg-card theirs" href="/messages.html?conversationId=${encodeURIComponent(conversationId)}">
                  <div>
                    <b>${window.escapeMessageHtml ? window.escapeMessageHtml(otherUser) : ""}</b>
                    <small>${window.escapeMessageHtml ? window.escapeMessageHtml(title) : ""}</small>
                  </div>
                  <p>${window.escapeMessageHtml ? window.escapeMessageHtml(body) : ""}</p>
                  <span>${conversation.updatedAt ? new Date(conversation.updatedAt).toLocaleString("tr-TR") : ""}</span>
                </a>
              `;
            }).join("");
          })
          .catch(() => {
            renderMessagesEmptyState(list);
          });
      };

      bindAuthAreaActions();
      bindListingActions();

      const authArea = document.getElementById("authArea");
      if (authArea) {
        const observer = new MutationObserver(() => bindAuthAreaActions());
        observer.observe(authArea, { childList: true, subtree: true });
      }

      const initialTab = new URLSearchParams(window.location.search).get("tab");
      if (initialTab === "messages") {
        window.loadSection("messages");
      } else {
        renderManagedListings();
      }
    })();
  </script>
</body>
</html>
