<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesajlar | Jetle</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YCWYPP371K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-YCWYPP371K");
  </script>
  <link rel="stylesheet" href="/style.css">
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --line: #e5e7eb;
      --muted: #6b7280;
      --text: #111827;
      --primary: #2563eb;
      --primary-soft: #f5f7fb;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --header-height: 68px;
      --viewport-offset-bottom: 0px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      overflow-x: hidden;
      overflow-y: hidden;
      height: 100vh;
      height: 100dvh;
    }

    .messages-shell {
      min-height: 100vh;
      min-height: 100dvh;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages-header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
      padding-top: env(safe-area-inset-top, 0px);
    }

    .messages-header-inner {
      max-width: 1320px;
      margin: 0 auto;
      min-height: 68px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .messages-brand {
      display: inline-flex;
      align-items: center;
      gap: 0;
      color: #0f172a;
      text-decoration: none;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .messages-brand span {
      color: var(--primary);
    }

    .messages-brand .brand-suffix {
      color: #0f172a;
    }

    .messages-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .messages-header-actions a,
    .messages-header-actions button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .messages-main {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 20px 18px calc(24px + var(--safe-bottom));
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .mobile-conversations-toggle {
      display: none;
      width: 100%;
      margin-bottom: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .messages-layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 300px;
      grid-template-rows: minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .panel-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .conversation-sidebar {
      overflow: hidden;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header,
    .chat-header,
    .listing-summary-header {
      padding: 16px 16px 14px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-header h2,
    .chat-header h2,
    .listing-summary-header h3 {
      margin: 0;
      font-size: 18px;
    }

    .sidebar-header p,
    .chat-header p,
    .listing-summary-header p {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .conversation-list {
      max-height: none;
      min-height: 0;
      height: 100%;
      overflow-y: auto;
      padding: 8px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .conversation-item {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      display: grid;
      gap: 6px;
      transition: background 0.2s ease, transform 0.2s ease;
      touch-action: manipulation;
    }

    .conversation-item:hover {
      background: #f9fafb;
      transform: translateY(-1px);
    }

    .conversation-item.active {
      background: #f6f8fb;
      outline: 1px solid #dbe3ee;
    }

    .conversation-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .conversation-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.35;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversation-time {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      flex: 0 0 auto;
      min-width: 42px;
      text-align: right;
      letter-spacing: 0;
    }

    .conversation-preview {
      font-size: 13px;
      color: #4b5563;
      line-height: 1.5;
      min-height: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .conversation-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .conversation-status {
      min-width: 24px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex: 0 0 auto;
    }

    .conversation-listing {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-badge {
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
    }

    .chat-panel {
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      min-width: 0;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .chat-header-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .chat-listing-thumb {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      flex: 0 0 auto;
      background: #e5e7eb;
    }

    .chat-header-copy {
      min-width: 0;
    }

    .chat-header-copy h2 {
      margin: 0;
      font-size: 18px;
    }

    .chat-header-copy p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-header-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .chat-feed {
      background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scroll-padding-bottom: 140px;
      min-height: 0;
      height: 100%;
    }

    .chat-empty {
      margin: auto;
      max-width: 420px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      gap: 5px;
    }

    .message-row.mine {
      margin-left: auto;
      align-items: flex-end;
    }

    .message-row.theirs {
      margin-right: auto;
      align-items: flex-start;
    }

    .message-bubble {
      border-radius: 18px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.5;
      border: 1px solid var(--line);
      background: #f9fafb;
      color: var(--text);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message-row.mine .message-bubble {
      background: #1f3f75;
      color: #f8fafc;
      border-color: #1f3f75;
      border-bottom-right-radius: 6px;
    }

    .message-row.theirs .message-bubble {
      background: #ffffff;
      border-bottom-left-radius: 6px;
    }

    .message-meta {
      font-size: 12px;
      color: var(--muted);
      padding: 0 6px;
      letter-spacing: 0;
      line-height: 1.4;
    }

    .message-tools {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 2px 6px 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-2px);
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    }

    .message-row.mine:hover .message-tools,
    .message-row.mine:focus-within .message-tools {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }

    .message-tool {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 0;
      cursor: pointer;
      letter-spacing: 0;
    }

    .message-tool:hover {
      color: var(--primary);
    }

    .edited-badge {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .message-row.mine .message-meta {
      color: #6b7280;
    }

    .chat-composer {
      border-top: 1px solid var(--line);
      padding: 14px;
      background: #fff;
      padding-bottom: calc(14px + var(--safe-bottom) + var(--viewport-offset-bottom));
      flex: 0 0 auto;
    }

    .composer-status {
      margin-top: 10px;
      display: none;
      font-size: 13px;
      color: #b91c1c;
    }

    .composer-status.show {
      display: block;
    }

    .composer-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: end;
    }

    .composer-input {
      width: 100%;
      min-height: 52px;
      max-height: 168px;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 14px 16px;
      font: inherit;
      color: var(--text);
      background: #fff;
      overflow-y: auto;
      transition: height 0.12s ease;
    }

    .composer-input:focus {
      outline: 2px solid #bfdbfe;
      border-color: #93c5fd;
    }

    .composer-send {
      border: 0;
      background: var(--primary);
      color: #fff;
      border-radius: 12px;
      padding: 14px 18px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      min-width: 120px;
      touch-action: manipulation;
    }

    .composer-cancel {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 14px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      display: none;
      touch-action: manipulation;
    }

    .composer-cancel.show {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .listing-summary {
      overflow: hidden;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .listing-summary-body {
      padding: 16px;
      display: grid;
      gap: 14px;
      overflow-y: auto;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    .listing-summary-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 12px;
      background: #e5e7eb;
    }

    .listing-summary-title {
      margin: 0;
      font-size: 16px;
      line-height: 1.4;
      color: var(--text);
    }

    .listing-summary-price {
      font-size: 24px;
      font-weight: 900;
      color: var(--primary);
    }

    .listing-summary-meta {
      display: grid;
      gap: 8px;
      font-size: 13px;
      color: #4b5563;
    }

    .listing-summary-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      padding: 12px 14px;
      background: #fff;
      color: #111827;
      text-decoration: none;
      font-weight: 800;
      border: 1px solid #d1d5db;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .listing-summary-link:hover {
      background: #f9fafb;
      border-color: #cbd5e1;
      color: #111827;
    }

    .empty-panel {
      padding: 24px 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .mobile-overlay {
      display: none;
    }

    .conversation-list::-webkit-scrollbar,
    .chat-feed::-webkit-scrollbar,
    .listing-summary-body::-webkit-scrollbar {
      width: 10px;
    }

    .conversation-list::-webkit-scrollbar-track,
    .chat-feed::-webkit-scrollbar-track,
    .listing-summary-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .conversation-list::-webkit-scrollbar-thumb,
    .chat-feed::-webkit-scrollbar-thumb,
    .listing-summary-body::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.55);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    .conversation-list,
    .chat-feed,
    .listing-summary-body {
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.55) transparent;
    }

    @media (max-width: 1080px) {
      .messages-layout {
        grid-template-columns: 280px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
      }

      .listing-summary {
        grid-column: 1 / -1;
        height: auto;
        max-height: min(240px, 28vh);
      }
    }

    @media (max-width: 820px) {
      .messages-main {
        padding: 14px 12px calc(20px + var(--safe-bottom));
      }

      .mobile-conversations-toggle {
        display: block;
      }

      .messages-layout {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 12px;
      }

      .conversation-sidebar {
        position: fixed;
        top: calc(var(--header-height) + env(safe-area-inset-top, 0px) + 8px);
        left: 8px;
        right: 8px;
        bottom: calc(8px + var(--safe-bottom));
        z-index: 35;
        display: block;
        transform: translateX(-110%);
        opacity: 0;
        visibility: hidden;
        transition: transform 0.22s ease, opacity 0.22s ease, visibility 0.22s ease;
      }

      .conversation-sidebar.open {
        transform: translateX(0);
        opacity: 1;
        visibility: visible;
      }

      .mobile-overlay {
        position: fixed;
        inset: calc(var(--header-height) + env(safe-area-inset-top, 0px)) 0 0;
        background: rgba(17, 24, 39, 0.35);
        z-index: 30;
        display: none;
      }

      .mobile-overlay.open {
        display: block;
      }

      .chat-panel {
        min-height: calc(100dvh - 152px - var(--safe-bottom));
        min-width: 0;
      }

      .chat-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .message-row {
        max-width: 88%;
        gap: 4px;
      }

      .message-bubble {
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.45;
      }

      .composer-form {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .composer-send,
      .composer-cancel {
        width: 100%;
      }

      .composer-input {
        min-width: 0;
        min-height: 46px;
      }

      .listing-summary {
        min-width: 0;
        height: auto;
        max-height: min(220px, 26vh);
      }

      .listing-summary-body {
        gap: 12px;
      }
    }

    @media (max-width: 768px) {
      body {
        overflow-x: hidden;
      }

      .messages-header-inner {
        min-height: 64px;
        padding: 0 12px;
      }

      :root {
        --header-height: 64px;
      }

      .messages-brand {
        font-size: 20px;
      }

      .messages-header-actions {
        gap: 8px;
      }

      .messages-header-actions a,
      .messages-header-actions button {
        padding: 9px 12px;
        font-size: 13px;
      }

      .messages-main {
        padding: 12px 10px 16px;
      }

      .mobile-conversations-toggle {
        margin-bottom: 10px;
        padding: 11px 12px;
      }

      .conversation-sidebar {
        left: 0;
        right: 0;
        top: calc(var(--header-height) + env(safe-area-inset-top, 0px));
        bottom: 0;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
      }

      .chat-panel {
        min-height: calc(100dvh - 142px - var(--safe-bottom));
        border-radius: 12px;
      }

      .chat-feed {
        padding: 12px 10px 10px;
      }

      .chat-composer {
        padding: 10px 10px calc(10px + var(--safe-bottom));
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(10px);
      }

      .composer-input {
        padding: 11px 13px;
      }

      .listing-summary-body {
        padding: 12px;
        gap: 10px;
      }

      .listing-summary-image {
        aspect-ratio: auto;
        height: 92px;
        max-height: 92px;
        object-fit: cover;
        border-radius: 10px;
      }

      .listing-summary {
        min-height: 0;
        height: auto;
        max-height: min(168px, 22vh);
      }

      .listing-summary-header {
        padding-bottom: 8px;
      }

      .listing-summary-title {
        font-size: 14px;
        line-height: 1.35;
      }

      .listing-summary-price {
        font-size: 18px;
        line-height: 1.1;
      }

      .listing-summary-meta {
        gap: 6px;
        font-size: 12px;
      }

      .message-meta {
        font-size: 11px;
        padding: 0 2px;
      }
    }

    @media (hover: none), (pointer: coarse) {
      .conversation-item:hover {
        background: transparent;
        transform: none;
      }

      .message-tools {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: none;
        gap: 10px;
      }

      .message-tool,
      .chat-header-btn,
      .composer-send,
      .composer-cancel,
      .conversation-item {
        min-height: 42px;
      }

      .message-tool {
        padding: 6px 0;
      }
    }
  </style>
</head>
<body data-page="messages">
  <div class="messages-shell">
    <header class="messages-header">
      <div class="messages-header-inner">
        <a class="messages-brand" href="/index.html"><span>jetle</span><span class="brand-suffix">.online</span></a>
        <div class="messages-header-actions">
          <a href="/dashboard.html">Profil</a>
          <button type="button" id="logoutBtn">Çıkış</button>
        </div>
      </div>
    </header>

    <main class="messages-main">
      <button class="mobile-conversations-toggle" type="button" id="mobileConversationToggle">Konuşmaları Göster</button>
      <div class="mobile-overlay" id="mobileOverlay"></div>

      <div class="messages-layout">
        <aside class="conversation-sidebar panel-card" id="conversationSidebar">
          <div class="sidebar-header">
            <h2>Konuşmalar</h2>
            <p>İlan bazlı görüşmelerinizi buradan takip edin.</p>
          </div>
          <div class="conversation-list" id="conversationList"></div>
        </aside>

        <section class="chat-panel panel-card">
          <div class="chat-header" id="chatHeader">
            <div class="chat-header-copy">
              <h2>Mesajlar</h2>
              <p>Bir konuşma seçildiğinde detaylar burada görünecek.</p>
            </div>
          </div>

          <div class="chat-feed" id="chatFeed">
            <div class="chat-empty">Henüz mesaj bulunmuyor.</div>
          </div>

          <div class="chat-composer">
            <form class="composer-form" id="composerForm" action="" novalidate>
              <textarea class="composer-input" id="messageInput" placeholder="Mesaj yaz..." rows="2"></textarea>
              <button class="composer-cancel" type="button" id="cancelEditBtn">İptal</button>
              <button class="composer-send" type="button" id="sendMessageBtn">Gönder</button>
            </form>
            <div class="composer-status" id="composerStatus"></div>
          </div>
        </section>

        <aside class="listing-summary panel-card" id="listingSummary">
          <div class="listing-summary-header">
            <h3>İlan Özeti</h3>
            <p>Konuştuğunuz ilanı hızlıca gözden geçirin.</p>
          </div>
          <div class="empty-panel">Bir ilan seçildiğinde özeti burada gösterilecek.</div>
        </aside>
      </div>
    </main>
  </div>

  <script src="/auth-global.js"></script>
  <script src="/chat-state.js"></script>
  <script src="/chat-api.js"></script>
  <script src="/chat-ui.js"></script>
</body>
</html>
