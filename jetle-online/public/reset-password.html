<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Yenile - Jetle</title>
  <meta name="description" content="Jetle hesabınız için yeni şifre belirleyin.">
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f4f6;
      --surface: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d7e0ea;
      --line-strong: #b7c4d4;
      --primary: #2563eb;
      --primary-strong: #1d4ed8;
      --primary-soft: rgba(37, 99, 235, 0.06);
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 24%),
        linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .reset-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .reset-topbar {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 22px 0 0;
    }

    .reset-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: inherit;
      text-decoration: none;
    }

    .reset-brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.22);
    }

    .reset-brand-copy { display: grid; gap: 2px; }
    .reset-brand-title { font-size: 18px; font-weight: 800; }
    .reset-brand-subtitle { font-size: 12px; color: var(--muted); }

    .reset-stage {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 24px 18px 34px;
    }

    .reset-card {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid rgba(215, 224, 234, 0.92);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 28px 26px 24px;
      display: grid;
      gap: 16px;
    }

    .reset-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef4ff;
      color: var(--primary-strong);
      font-size: 11px;
      font-weight: 700;
    }

    .reset-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--primary);
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.15;
      font-weight: 800;
    }

    .reset-subtitle {
      margin: 8px 0 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .reset-form { display: grid; gap: 14px; }
    .reset-field { display: grid; gap: 7px; }
    .reset-field label { font-size: 12px; font-weight: 700; color: #344054; }

    .reset-form input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 0 13px;
      color: var(--text);
      font-size: 13px;
      transition: border-color 0.18s ease, background-color 0.18s ease;
    }

    .reset-form input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 1px var(--primary-soft);
    }

    .reset-button {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: none;
    }

    .reset-button:disabled {
      opacity: 0.72;
      cursor: not-allowed;
      box-shadow: none;
    }

    .reset-button.is-loading {
      position: relative;
      pointer-events: none;
      opacity: 0.86;
    }

    .reset-button.is-loading::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 6px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: #fff;
      border-radius: 999px;
      vertical-align: -2px;
      animation: auth-spin 0.8s linear infinite;
    }

    .auth-message {
      min-height: 18px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .reset-login-row {
      margin-top: 2px;
      padding-top: 14px;
      border-top: 1px solid #eef2f7;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .text-link {
      color: var(--primary-strong);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }

    .text-link:hover { text-decoration: underline; }

    @keyframes auth-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 640px) {
      .reset-topbar { width: calc(100% - 28px); padding-top: 16px; }
      .reset-stage { padding: 20px 14px 28px; }
      .reset-card { border-radius: 12px; padding: 22px 18px 20px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="reset-page">
    <header class="reset-topbar">
      <a class="reset-brand" href="/" aria-label="Jetle ana sayfa">
        <span class="reset-brand-mark">J</span>
        <span class="reset-brand-copy">
          <span class="reset-brand-title">Jetle.online</span>
          <span class="reset-brand-subtitle">Güvenli hesap erişimi</span>
        </span>
      </a>
    </header>

    <main class="reset-stage">
      <form class="reset-card reset-form" id="resetPasswordForm">
        <div class="reset-badge">
          <span class="reset-badge-dot"></span>
          Yeni şifrenizi belirleyin
        </div>

        <div>
          <h1>Şifre Yenile</h1>
          <p class="reset-subtitle">Hesabınız için yeni bir şifre oluşturun ve güvenle devam edin.</p>
        </div>

        <div class="reset-field">
          <label for="reset-password">Yeni şifre</label>
          <input id="reset-password" name="password" type="password" placeholder="Yeni şifrenizi girin" required>
        </div>

        <div class="reset-field">
          <label for="reset-password2">Şifre tekrar</label>
          <input id="reset-password2" name="password2" type="password" placeholder="Şifrenizi tekrar girin" required>
        </div>

        <button class="reset-button" type="submit">Şifreyi Değiştir</button>

        <p class="auth-message" id="authMessage"></p>

        <div class="reset-login-row">
          Giriş ekranına dönmek için <a class="text-link" href="/login.html">Giriş yap</a>
        </div>
      </form>
    </main>
  </div>

  <script defer src="/js/auth.js"></script>
</body>
</html>
