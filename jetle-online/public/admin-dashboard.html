<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jetle Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f6f8;
      color: #111827;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .admin-layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px 1fr;
    }

    .sidebar {
      background: #172033;
      color: #fff;
      padding: 22px 18px;
    }

    .brand {
      margin: 0 0 28px;
      font-size: 22px;
      font-weight: 800;
    }

    .brand span { color: #60a5fa; }

    .menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .menu li {
      padding: 12px 14px;
      border-radius: 10px;
      color: #dbe3ef;
      cursor: pointer;
      font-weight: 650;
      transition: 0.2s ease;
    }

    .menu li:hover,
    .menu li.active {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .main { min-width: 0; }

    .topbar {
      height: 68px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
    }

    .admin-top-actions,
    .admin-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logout-btn,
    .admin-card button {
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      background: #eff6ff;
      color: #2563eb;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .logout-btn:hover,
    .admin-card button:hover {
      background: #dbeafe;
    }

    .admin-card button.danger,
    .admin-card .danger {
      background: #fef2f2;
      color: #dc2626;
    }

    .content {
      padding: 24px 26px 34px;
    }

    .content h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .stats-grid {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      font-weight: bold;
    }

    .chart-card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin: 0 26px 20px;
      padding: 16px;
    }

    .chart-card h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin: 0 26px 20px;
    }

    .charts-grid .chart-card {
      margin: 0;
    }

    .admin-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 15px;
      margin-bottom: 10px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #eee;
      transition: 0.2s ease;
    }

    .admin-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    }

    .admin-card strong {
      display: block;
      margin-bottom: 4px;
    }

    .admin-card.danger {
      border-left: 4px solid red;
      background: #fff5f5;
    }

    .empty {
      padding: 14px;
      border: 1px dashed #d1d5db;
      border-radius: 10px;
      color: #6b7280;
      background: #f9fafb;
      font-size: 14px;
    }

    .messages-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .messages-meta {
      color: #6b7280;
      font-size: 13px;
    }

    .message-admin-card {
      align-items: flex-start;
      flex-direction: column;
      gap: 12px;
    }

    .message-admin-row {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .message-admin-main {
      min-width: 0;
      flex: 1;
    }

    .message-admin-main strong,
    .message-admin-users strong {
      margin-bottom: 6px;
    }

    .message-admin-users {
      min-width: 220px;
      color: #4b5563;
      font-size: 13px;
      line-height: 1.5;
    }

    .message-admin-users span {
      display: block;
    }

    .message-admin-preview {
      color: #111827;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message-admin-subline {
      margin-top: 6px;
      color: #6b7280;
      font-size: 12px;
    }

    .message-admin-link {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    .message-admin-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 620px) {
      .admin-layout { grid-template-columns: 1fr; }
      .topbar {
        height: auto;
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
        padding: 16px;
      }
      .content { padding: 16px; }
      .chart-card { margin: 0 16px 16px; }
      .charts-grid {
        grid-template-columns: 1fr;
        margin: 0 16px 16px;
      }

      .charts-grid .chart-card {
        margin: 0;
      }
      .admin-card {
        align-items: flex-start;
        flex-direction: column;
      }
    }
    /* UI polish layer */
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
    }

    .main {
      padding: 28px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(10px);
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 22px;
      box-shadow: 0 12px 28px rgba(15,23,42,0.08);
    }

    .sidebar,
    .chart-card,
    .admin-card,
    .stat-card {
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(15,23,42,0.08);
    }

    .chart-card,
    .admin-card,
    .stat-card {
      padding: 18px;
    }

    .admin-card {
      border: 1px solid #e5e7eb;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .admin-card:hover,
    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 36px rgba(15,23,42,0.12);
      border-color: #bfdbfe;
    }

    .admin-card strong {
      font-weight: 800;
      color: #111827;
    }

    .admin-card div div,
    .admin-card p,
    .admin-card small {
      color: #6b7280;
      font-size: 13px;
    }

    .admin-card div div {
      margin-top: 4px;
    }

    .admin-card button,
    .logout-btn {
      border-radius: 8px;
      border: 0;
      padding: 8px 12px;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .admin-card button:hover,
    .logout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(15,23,42,0.12);
    }

    .admin-card button:not(.danger),
    .admin-actions .primary {
      background: #2563eb;
      color: #fff;
    }

    .admin-card button:not(.danger):hover {
      background: #1d4ed8;
    }

    .admin-card button.danger,
    .admin-card .danger,
    button.danger {
      background: #dc2626;
      color: #fff;
    }

    .admin-card button.danger:hover,
    button.danger:hover {
      background: #b91c1c;
    }

    .badge-boost {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #facc15;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      margin-right: 6px;
      display: inline-flex;
      margin-bottom: 8px;
    }

    .badge-passive {
      background: #eef2ff;
      color: #3730a3;
      border: 1px solid #c7d2fe;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      margin-right: 6px;
      display: inline-flex;
      margin-bottom: 8px;
    }

    .badge-pending {
      background: #fff7ed;
      color: #c2410c;
      border: 1px solid #fdba74;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      margin-right: 6px;
      display: inline-flex;
      margin-bottom: 8px;
    }

    .badge-approved {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #6ee7b7;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      margin-right: 6px;
      display: inline-flex;
      margin-bottom: 8px;
    }

    .badge-suspicious {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      margin-right: 6px;
      display: inline-flex;
      margin-bottom: 8px;
    }

    .toolbar-card,
    .skeleton-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 10px 28px rgba(15,23,42,0.08);
      margin-bottom: 12px;
    }

    .toolbar-row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .toolbar-row .admin-actions {
      flex-wrap: wrap;
    }

    .skeleton-line {
      height: 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 37%, #e5e7eb 63%);
      background-size: 400% 100%;
      animation: shimmer 1.25s infinite;
      margin-top: 10px;
    }

    .skeleton-line.short { width: 28%; }
    .skeleton-line.medium { width: 52%; }
    .skeleton-line.long { width: 78%; }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: 0 0; }
    }

    .admin-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.56);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .admin-modal.open {
      display: flex;
    }

    .admin-modal-card {
      width: min(760px, 100%);
      max-height: 88vh;
      overflow: auto;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 24px 60px rgba(15,23,42,0.18);
      padding: 20px;
    }

    .admin-modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .admin-modal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .admin-modal-grid img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      background: #f3f4f6;
    }

    .toast-stack {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 120;
      display: grid;
      gap: 10px;
      width: min(360px, calc(100vw - 32px));
    }

    .toast {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #dbeafe;
      background: #eff6ff;
      color: #1e3a8a;
      box-shadow: 0 12px 28px rgba(15,23,42,0.12);
      font-size: 14px;
      font-weight: 600;
    }

    .toast.error {
      background: #fef2f2;
      color: #b91c1c;
      border-color: #fecaca;
    }

    .toast.success {
      background: #ecfdf5;
      color: #047857;
      border-color: #a7f3d0;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.58);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 110;
    }

    .loading-overlay.open {
      display: flex;
    }

    .loading-spinner {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 4px solid #dbeafe;
      border-top-color: #2563eb;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 620px) {
      .admin-modal-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <h2 class="brand">Jetle<span>Admin</span></h2>
      <nav class="menu">
        <ul>
          <li class="active" data-page="listings">İlanlar</li>
          <li data-page="users">Kullanıcılar</li>
          <li data-page="messages">Mesajlar</li>
          <li data-page="reports">Raporlar</li>
          <li data-page="cars">Araç Yönetimi</li>
          <li data-page="notifications">Bildirimler</li>
        </ul>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1>Admin Moderasyon</h1>
        <div class="admin-top-actions">
          <span>Admin</span>
          <button type="button" class="logout-btn" data-action="logout">Çıkış</button>
        </div>
      </header>

      <div id="stats-box"></div>

      <section class="charts-grid">
        <div class="chart-card">
          <h2>Günlük İlan</h2>
          <canvas id="dailyListingsChart" height="140"></canvas>
        </div>
        <div class="chart-card">
          <h2>Görüntülenme</h2>
          <canvas id="dailyViewsChart" height="140"></canvas>
        </div>
      </section>

      <section class="content dashboard-content"></section>
    </main>
  </div>

  <div class="admin-modal" id="admin-modal">
    <div class="admin-modal-card" id="admin-modal-card"></div>
  </div>
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner" aria-hidden="true"></div>
  </div>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script>
    const AUTH_STORAGE_KEYS = ["token", "user", "userId", "userEmail", "userRole", "admin"];
    const adminRaw = localStorage.getItem("admin");
    const token = localStorage.getItem("token");
    let admin = null;
    try {
      admin = adminRaw ? JSON.parse(adminRaw) : null;
    } catch (err) {
      admin = null;
    }
    const STATS_URL = "/api/admin/stats";
    const ANALYTICS_URL = "/api/admin/analytics";
    let currentAdminPage = "listings";
    let userSearchQuery = "";
    let listingStatusFilter = "all";
    let listingSelection = new Set();
    let adminUsersCache = [];
    let adminListingsCache = [];

    document.addEventListener("submit", (event) => {
      event.preventDefault();
    }, true);

    if (!admin || !token || admin.role !== "admin") {
      window.location.href = "/admin.html";
    }

    function clearAdminSessionStorage() {
      AUTH_STORAGE_KEYS.forEach((key) => localStorage.removeItem(key));
    }

    function logoutAdmin() {
      clearAdminSessionStorage();
      window.location.href = "/admin.html";
    }

    function number(value) {
      return new Intl.NumberFormat("tr-TR").format(Number(value || 0));
    }

    function contentContainer() {
      return document.querySelector(".dashboard-content");
    }

    function redirectToAdminLogin() {
      clearAdminSessionStorage();
      window.location.href = "/admin.html";
    }

    function authHeaders(extra = {}) {
      const headers = { ...extra };
      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }
      return headers;
    }

    function authFetch(url, options = {}) {
      const nextOptions = { ...options };
      nextOptions.headers = authHeaders(options.headers || {});
      return fetch(url, nextOptions);
    }

    function ensureAdminResponse(res, message = "API HATA") {
      if (res.status === 401 || res.status === 403) {
        redirectToAdminLogin();
        throw new Error("Unauthorized");
      }

      if (!res.ok) {
        throw new Error(message);
      }

      return res;
    }

    function setActiveMenu(type) {
      const pages = ["listings", "users", "messages", "reports", "cars", "notifications"];
      document.querySelectorAll(".menu li").forEach((item) => item.classList.remove("active"));
      const target = document.querySelectorAll(".menu li")[pages.indexOf(type)];
      if (target) target.classList.add("active");
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function matchesListingFilter(item) {
      if (listingStatusFilter === "pending") return item.status === "pending";
      if (listingStatusFilter === "approved") return isApprovedListing(item);
      if (listingStatusFilter === "suspicious") return Boolean(item.isSuspicious);
      if (listingStatusFilter === "inactive") return item.isActive === false;
      return true;
    }

    function isApprovedListing(item) {
      const status = String(item?.status || "").trim().toLowerCase();
      return Boolean(item?.approved === true && ["approved", "active"].includes(status));
    }

    function statusLabel(item) {
      const status = String(item?.status || "").trim().toLowerCase();
      if (status === "pending") return "Onay Bekliyor";
      if (status === "rejected") return "Reddedildi";
      if (item?.isActive === false) return "Pasif";
      if (isApprovedListing(item)) return "Onaylı";
      return status || "-";
    }

    function listingCategoryLabel(item) {
      return item?.subCategory || item?.mainCategory || item?.category || "-";
    }

    function setUserSearch(value) {
      userSearchQuery = String(value || "");
      if (currentAdminPage === "users") {
        loadPage("users");
      }
    }

    function setListingStatusFilter(value) {
      listingStatusFilter = String(value || "all");
      listingSelection = new Set();
      if (currentAdminPage === "listings") {
        loadPage("listings");
      }
    }

    function renderListingBadgesMarkup(item) {
      return `
        ${item.status === "pending" ? '<span class="badge-pending">? Onay Bekliyor</span>' : ''}
        ${isApprovedListing(item) ? '<span class="badge-approved">Onaylı</span>' : ''}
        ${item.status === "rejected" ? '<span class="badge-passive">Reddedildi</span>' : ''}
        ${item.isSuspicious ? '<span class="badge-suspicious">Şüpheli</span>' : ''}
        ${item.isFeatured ? '<span class="badge-boost">Vitrin</span>' : ''}
        ${!item.isFeatured && item.isBoosted ? '<span class="badge-boost">Boost</span>' : ''}
        ${item.isActive === false ? '<span class="badge-passive">Pasif</span>' : ''}
      `;
    }

    function openAdminModal(html) {
      const modal = document.getElementById("admin-modal");
      const card = document.getElementById("admin-modal-card");
      if (!modal || !card) return;
      card.innerHTML = html;
      modal.classList.add("open");
    }

    function closeAdminModal(event) {
      const modal = document.getElementById("admin-modal");
      const card = document.getElementById("admin-modal-card");
      if (!modal || !card) return;
      if (event && event.target && event.target !== modal) return;
      modal.classList.remove("open");
      card.innerHTML = "";
    }

    function setLoading(open) {
      const overlay = document.getElementById("loading-overlay");
      if (!overlay) return;
      overlay.classList.toggle("open", Boolean(open));
    }

    function showToast(message, type = "success") {
      const stack = document.getElementById("toast-stack");
      if (!stack || !message) return;
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.textContent = String(message);
      stack.appendChild(toast);
      window.setTimeout(() => {
        toast.remove();
      }, 3200);
    }

    function renderLoadingSkeleton(title = "Yükleniyor") {
      const container = contentContainer();
      if (!container) return;
      container.innerHTML = `
        <h2>${title}</h2>
        <div class="skeleton-card">
          <div class="skeleton-line short"></div>
          <div class="skeleton-line long"></div>
          <div class="skeleton-line medium"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-line short"></div>
          <div class="skeleton-line long"></div>
          <div class="skeleton-line medium"></div>
        </div>
      `;
    }

    function renderDefaultStats() {
      const box = document.getElementById("stats-box");
      if (!box) return;
      box.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card">Toplam Kullanıcı: 0</div>
          <div class="stat-card">Toplam İlan: 0</div>
          <div class="stat-card">Aktif İlan: 0</div>
          <div class="stat-card">Onay Bekleyen: 0</div>
          <div class="stat-card">Şüpheli İlan: 0</div>
          <div class="stat-card">Bugün Eklenen: 0</div>
          <div class="stat-card">Toplam Mesaj: 0</div>
          <div class="stat-card">Online Kullanıcı: 0</div>
          <div class="stat-card">Aktif Socket: 0</div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">En çok ilan kategorisi: -</div>
          <div class="stat-card">En aktif şehir: -</div>
          <div class="stat-card">Haftalık büyüme: %0</div>
        </div>
        <div id="pending-approval-box"></div>
      `;
    }

    function renderDefaultListings() {
      const container = contentContainer();
      if (!container) return;
      container.innerHTML = `
        <h2>İlanlar</h2>
        <div class="admin-card">
          <div>İlan bulunamadı.</div>
        </div>
      `;
    }

    function renderSimpleChart(cardSelector, title, labels, values, color) {
      const card = document.querySelector(cardSelector);
      if (!card) return;
      const safeLabels = Array.isArray(labels) ? labels : [];
      const safeValues = Array.isArray(values) ? values : [];
      const maxValue = Math.max(1, ...safeValues.map((value) => Number(value || 0)));
      const rows = safeLabels.map((label, index) => {
        const value = Number(safeValues[index] || 0);
        const width = Math.max(8, Math.round((value / maxValue) * 100));
        return `
          <div style="display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;margin-top:10px;">
            <span style="font-size:12px;color:#6b7280;">${escapeHtml(label)}</span>
            <div style="height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;">
              <div style="height:100%;width:${width}%;background:${color};border-radius:999px;"></div>
            </div>
            <strong style="font-size:12px;color:#111827;">${number(value)}</strong>
          </div>
        `;
      }).join("");

      card.innerHTML = `
        <h2>${title}</h2>
        ${rows || '<div class="empty">Veri yok</div>'}
      `;
    }

    async function markNotificationsAsRead(notifications) {
      const unreadItems = (Array.isArray(notifications) ? notifications : []).filter(
        (item) => item && item.isRead !== true && item._id
      );
      if (!unreadItems.length) return;

      await Promise.all(
        unreadItems.map((item) =>
          authFetch(`/api/admin/notifications/${item._id}/read`, { method: "PUT" })
            .then((res) => ensureAdminResponse(res, "Notification read failed"))
            .catch((err) => {
              console.error("NOTIFICATION READ ERROR:", err);
            })
        )
      );

      unreadItems.forEach((item) => {
        item.isRead = true;
      });
    }

    async function loadNotifications() {
      try {
        const res = await authFetch("/api/admin/notifications");
        ensureAdminResponse(res, "Notification fetch error");
        const data = await res.json();
        const notifications = Array.isArray(data) ? data.slice() : [];
        const unreadCount = Number(
          res.headers.get("X-Notification-Unread-Count") ||
          notifications.filter((item) => item && item.isRead !== true).length ||
          0
        );
        const totalCount = Number(
          res.headers.get("X-Notification-Total-Count") ||
          notifications.length ||
          0
        );
        const notificationIcons = {
          feature: "?",
          boost: "^",
          approve: "?",
          reject: "?",
          ban: "?"
        };

        const container = contentContainer();
        if (!container || currentAdminPage !== "notifications") return;

        container.innerHTML = `
          <h2>Bildirimler</h2>
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
            <div class="toolbar-card"><strong>Toplam Bildirim</strong><div>${totalCount}</div></div>
            <div class="toolbar-card"><strong>Okunmamış Bildirim</strong><div>${unreadCount}</div></div>
          </div>
          ${
            notifications.length === 0
              ? "<p>Bildirim yok</p>"
              : notifications.map(n => `
                <div class="admin-card" style="${n.isRead === true ? "opacity:.78;" : "border-color:#bfdbfe;background:#eff6ff;"}">
                  <strong>${notificationIcons[n.type] || "?"} ${n.type}</strong>
                  <p>${n.message}</p>
                  <small>${new Date(n.createdAt).toLocaleString()}</small>
                </div>
              `).join("")
          }
        `;
        await markNotificationsAsRead(notifications);
      } catch (err) {
        console.error("NOTIFICATION ERROR:", err);
        const container = contentContainer();
        if (!container) return;
        container.innerHTML = `
          <h2>Bildirimler</h2>
          <div class="empty">Veri alınamadı</div>
        `;
      }
    }

        showToast("İlan silindi.", "success");

    async function bulkApproveSelected() {
      const ids = Array.from(listingSelection);
      if (!ids.length) return;
      setLoading(true);
      for (const id of ids) {
        try {
          const res = await authFetch(`/api/admin/listings/${id}/approve`, { method: "PATCH" });
          ensureAdminResponse(res, "Approve failed");
        } catch (err) {
          console.error("BULK APPROVE ERROR:", err);

      }
      listingSelection = new Set();
      setLoading(false);
      showToast("Seçili ilanlar onaylandi.", "success");
      loadPage("listings");
      await loadNotifications();

          <div class="admin-modal-head">
            <div>
              <h2 style="margin:0 0 6px;">${escapeHtml(item.title || "İlan")}</h2>
              <div style="color:#6b7280;">${escapeHtml(item.city || "")} ${item.price ? "- " + escapeHtml(number(item.price) + " TL") : ""}</div>
            </div>
          <button type="button" class="logout-btn" data-action="close-modal">Kapat</button>
        </div>
        <div style="margin-bottom:14px;">${renderListingBadgesMarkup(item)}</div>
        <p style="color:#374151;line-height:1.55;">${escapeHtml(item.description || item.desc || "Açıklama yok")}</p>
        <div class="admin-modal-grid">
          ${(images.length ? images : [item.image]).filter(Boolean).map((src) => `
            <img src="${escapeHtml(src)}" alt="İlan görseli" />
          `).join("")}
        </div>
      `);
    }

    async function showUserDetail(id) {
      try {
        setLoading(true);
        const res = await authFetch(`/api/admin/users/${id}`);
        const data = await ensureAdminResponse(res, "User detail failed").json();
        const listings = Array.isArray(data.listings) ? data.listings : [];
        openAdminModal(`
          <div class="admin-modal-head">
            <div>
              <h2 style="margin:0 0 6px;">${escapeHtml(data.user.name || "Kullanıcı")}</h2>
              <div style="color:#6b7280;">${escapeHtml(data.user.email || "")}</div>
            </div>
            <button type="button" class="logout-btn" data-action="close-modal">Kapat</button>
          </div>
          <div class="admin-modal-grid">
            <div class="toolbar-card"><strong>Rol</strong><div>${escapeHtml(data.user.role || "user")}</div></div>
            <div class="toolbar-card"><strong>Durum</strong><div>${data.banned ? "Banli" : "Aktif"}</div></div>
            <div class="toolbar-card"><strong>Toplam İlan</strong><div>${number(data.totalListings || 0)}</div></div>
            <div class="toolbar-card"><strong>Aktif İlan</strong><div>${number(data.activeListings || 0)}</div></div>
            <div class="toolbar-card"><strong>Favori Sayısı</strong><div>${number(data.favoriteCount || 0)}</div></div>
            <div class="toolbar-card"><strong>Kayıt Tarihi</strong><div>${data.createdAt ? new Date(data.createdAt).toLocaleString("tr-TR") : "-"}</div></div>
          </div>
          <div class="toolbar-card" style="margin-top:18px;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
              <strong>Kullanıcının İlanları</strong>
              <div style="color:#6b7280;font-size:13px;">Toplam ${number(listings.length)}</div>
            </div>
            ${listings.length ? `
              <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;">
                  <thead>
                    <tr style="text-align:left;border-bottom:1px solid #e5e7eb;">
                      <th style="padding:10px 8px;">İlan Başlığı</th>
                      <th style="padding:10px 8px;">İlan No</th>
                      <th style="padding:10px 8px;">Kategori</th>
                      <th style="padding:10px 8px;">Şehir</th>
                      <th style="padding:10px 8px;">Fiyat</th>
                      <th style="padding:10px 8px;">Durum</th>
                      <th style="padding:10px 8px;">Tarih</th>
                      <th style="padding:10px 8px;">İlanı Aç</th>
                      <th style="padding:10px 8px;">Admin Detay</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${listings.map((item) => `
                      <tr style="border-bottom:1px solid #f3f4f6;">
                        <td style="padding:12px 8px;">${escapeHtml(item.title || "İlan")}</td>
                        <td style="padding:12px 8px;">${escapeHtml(item.listingNo || "-")}</td>
                        <td style="padding:12px 8px;">${escapeHtml(listingCategoryLabel(item))}</td>
                        <td style="padding:12px 8px;">${escapeHtml(item.city || "-")}</td>
                        <td style="padding:12px 8px;">${item.price ? `${number(item.price)} TL` : "-"}</td>
                        <td style="padding:12px 8px;">${escapeHtml(statusLabel(item))}</td>
                        <td style="padding:12px 8px;">${item.createdAt ? new Date(item.createdAt).toLocaleDateString("tr-TR") : "-"}</td>
                        <td style="padding:12px 8px;"><button type="button" data-action="detail" data-id="${item._id}">İlanı Aç</button></td>
                        <td style="padding:12px 8px;"><button type="button" data-action="preview" data-id="${item._id}">Admin Detay</button></td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            ` : `<div class="empty">Bu kullanıcının ilanı yok.</div>`}
          </div>
        `);
      } catch (err) {
        console.error("USER DETAIL ERROR:", err);
        showToast("Kullanıcı detayı alınamadı.", "error");
      } finally {
        setLoading(false);
      }
    }

    function viewListingDetail(id) {
      if (!id) return;
      window.open(`/listing-detail.html?id=${id}`, "_blank", "noopener");
    }

    function previewListing(id) {
      showListingDetail(id);
    }

    function openListingDetail(id) {
      viewListingDetail(id);
    }

    function bulkApprove() {
      return bulkApproveSelected();
    }

    function bulkReject() {
      return bulkRejectSelected();
    }

    async function toggleListing(id) {
      try {
        setLoading(true);
        const res = await authFetch(`/api/admin/listings/${id}/toggle`, { method: "PATCH" });
        ensureAdminResponse(res, "Toggle failed");
        loadPage("listings");
        await loadNotifications();
        showToast("İlan durumu güncellendi.", "success");
      } catch (err) {
        console.error(err);
        showToast("İşlem başarısız.", "error");
      } finally {
        setLoading(false);
      }
    }

    async function markSuspicious(id) {
      try {
        setLoading(true);
        const res = await authFetch("/api/admin/listings/" + id, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ isSuspicious: true })
        });
        ensureAdminResponse(res, "Suspicious failed");
        showToast("İlan şüpheli olarak işaretlendi.", "success");
      } catch (err) {
        console.error("SUSPICIOUS ERROR:", err);
        showToast("İşlem başarısız.", "error");
      } finally {
        setLoading(false);
      }
      loadPage("listings");
    }

    async function boostListing(id) {
      try {
        setLoading(true);
        const res = await authFetch(`/api/admin/listings/${id}/boost`, { method: "PATCH" });
        ensureAdminResponse(res, "Boost failed");
        loadPage("listings");
        await loadNotifications();
        showToast("İlan Öne Çıkarildi.", "success");
      } catch (err) {
        console.error(err);
        showToast("Boost işlemi başarısız.", "error");
      } finally {
        setLoading(false);
      }
    }

    async function featureListing(id) {
      try {
        setLoading(true);
        const res = await authFetch(`/api/admin/listings/${id}/feature`, { method: "PATCH" });
        ensureAdminResponse(res, "Feature failed");
        loadPage("listings");
        await loadNotifications();
        showToast("İlan vitrine alındı.", "success");
      } catch (err) {
        console.error("FEATURE ERROR:", err);
        showToast("Vitrin işlemi başarısız.", "error");
        loadPage("listings");
      } finally {
        setLoading(false);
      }
    }

    async function approveListing(id) {
      try {
        setLoading(true);
        const res = await authFetch(`/api/admin/listings/${id}/approve`, { method: "PATCH" });
        ensureAdminResponse(res, "Approve failed");
        loadPage("listings");
        await loadNotifications();
        showToast("İlan onaylandı.", "success");
      } catch (err) {
        console.error("APPROVE ERROR:", err);
        showToast("İlan onaylanamadı.", "error");
        loadPage("listings");
      } finally {
        setLoading(false);
      }
    }

    function rejectListing(id) {
      if (!window.confirm("Bu ilanı reddetmek istediğinize emin misiniz?")) {
        return;
      }
      setLoading(true);
      authFetch(`/api/admin/listings/${id}/reject`, { method: "PATCH" })
        .then((res) => {
          ensureAdminResponse(res, "Reject failed");
          showToast("İlan reddedildi.", "success");
          loadPage("listings");
        })
        .catch((err) => {
          console.error("REJECT ERROR:", err);
          showToast("İlan reddedilemedi.", "error");
          loadPage("listings");
        })
        .finally(() => {
          setLoading(false);
        });
    }

    async function banUser(id) {
      try {
        setLoading(true);
        const res = await authFetch("/api/admin/users/" + id + "/ban", { method: "PATCH" });
        const data = await ensureAdminResponse(res, "Ban failed").json();
        showToast(data.banned ? "Kullanıcı banlandı." : "Kullanıcının banı kaldırıldı.", "success");
      } catch (err) {
        console.error("BAN ERROR:", err);
        showToast("Kullanıcı işlemi başarısız.", "error");
      } finally {
        setLoading(false);
      }
      loadPage("users");
    }

    async function safeInit() {
      renderDefaultStats();
      renderDefaultListings();

      await Promise.allSettled([
        Promise.resolve(loadStats()),
        Promise.resolve(loadAnalytics())
      ]);

      try {
        loadPage("listings");
      } catch (err) {
        console.error("SAFE INIT ERROR:", err);
        renderDefaultListings();
      }
    }

    document.addEventListener("click", (event) => {
      const pageItem = event.target.closest("[data-page]");
      if (pageItem) {
        loadPage(pageItem.dataset.page);
        return;
      }

      const actionEl = event.target.closest("[data-action]");
      if (!actionEl) return;

      const action = actionEl.dataset.action;
      const id = actionEl.dataset.id || "";

      if (action === "logout") return logoutAdmin();
      if (action === "approve") return approveListing(id);
      if (action === "reject") return rejectListing(id);
      if (action === "delete") return deleteListing(id);
      if (action === "preview") return previewListing(id);
      if (action === "detail") return openListingDetail(id);
      if (action === "toggle") return toggleListing(id);
      if (action === "suspicious") return markSuspicious(id);
      if (action === "boost") return boostListing(id);
      if (action === "feature") return featureListing(id);
      if (action === "bulk-approve") return bulkApprove();
      if (action === "bulk-reject") return bulkReject();
      if (action === "user-detail") return showUserDetail(id);
      if (action === "ban-user") return banUser(id);
      if (action === "close-modal") return closeAdminModal();
    });

    document.addEventListener("change", (event) => {
      const actionEl = event.target.closest("[data-action]");
      if (!actionEl) return;

      if (actionEl.dataset.action === "listing-status-filter") {
        setListingStatusFilter(event.target.value);
        return;
      }

      if (actionEl.dataset.action === "toggle-selection") {
        toggleListingSelection(actionEl.dataset.id || "", Boolean(event.target.checked));
      }
    });

    document.addEventListener("input", (event) => {
      const actionEl = event.target.closest("[data-action]");
      if (!actionEl) return;

      if (actionEl.dataset.action === "user-search") {
        setUserSearch(event.target.value);
      }
    });

    document.getElementById("admin-modal").addEventListener("click", (event) => {
      if (event.target.id === "admin-modal") {
        closeAdminModal();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      safeInit();
    }, { once: true });
  </script>
</body>
</html>
