<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil | Jetle</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #111827;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }

    .navbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 10px 16px;
      display: grid;
      grid-template-columns: 150px minmax(280px, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .logo {
      color: #2563eb;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.2px;
      text-decoration: none;
      white-space: nowrap;
    }

    .logo span {
      color: #111827;
    }

    .search {
      display: flex;
      min-width: 0;
    }

    .search input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1px solid #d1d5db;
      border-right: 0;
      border-radius: 8px 0 0 8px;
      outline: none;
      background: #f9fafb;
      font: inherit;
    }

    .search input:focus {
      border-color: #2563eb;
      background: #fff;
    }

    .search button {
      height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 0 8px 8px 0;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    .nav-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 0;
    }

    #authArea {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 0;
    }

    #authArea a {
      text-decoration: none;
    }

    #authArea .auth-user {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    #authArea .user-name {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #111827;
      font-size: 14px;
      font-weight: 700;
    }

    #authArea .panel-link,
    #authArea .logout-btn,
    #authArea > a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: #fff;
      color: #374151;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
    }

    .page {
      max-width: 1050px;
      margin: 0 auto;
      padding: 24px;
    }

    .profile-card,
    .listings-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.05);
    }

    .profile-card {
      display: grid;
      gap: 14px;
      margin-bottom: 18px;
    }

    .profile-main h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    .profile-main p {
      margin: 0;
      color: #6b7280;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .stat-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
      font-weight: 700;
    }

    .stat-card span {
      display: block;
      margin-top: 4px;
      color: #2563eb;
      font-size: 22px;
    }

    .listings-card h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .listing-item {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid #eef0f3;
    }

    .listing-item:last-child {
      border-bottom: 0;
    }

    .listing-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .listing-item p {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
    }

    .listing-item a {
      align-self: center;
      white-space: nowrap;
      padding: 8px 10px;
      border-radius: 8px;
      background: #eff6ff;
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
    }

    .empty {
      padding: 14px;
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      border-radius: 10px;
      color: #6b7280;
    }

    @media (max-width: 900px) {
      .navbar-inner {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "logo auth"
          "search search";
      }

      .logo {
        grid-area: logo;
      }

      .search {
        grid-area: search;
      }

      .nav-right {
        grid-area: auth;
      }
    }

    @media (max-width: 720px) {
      .navbar-inner {
        padding: 10px 14px;
        gap: 10px;
      }

      .page { padding: 16px; }
      .stats-grid { grid-template-columns: 1fr; }
      .listing-item { flex-direction: column; }
      .listing-item a { align-self: flex-start; }
      .search input,
      .search button {
        height: 40px;
      }
      #authArea .auth-user {
        gap: 8px;
      }
      #authArea .panel-link,
      #authArea .logout-btn,
      #authArea > a {
        min-height: 36px;
        padding: 0 10px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="/index.html">jetle<span>.online</span></a>
      <form class="search" action="/listings.html" method="get">
        <input type="text" name="search" placeholder="Kelime, ilan no veya kategori ara">
        <button type="submit">Ara</button>
      </form>
      <div class="nav-right">
        <div id="authArea"></div>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="profile-card">
      <div class="profile-main">
        <h1 id="profileName">Profil</h1>
        <p id="profileEmail"></p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">Toplam ilan <span id="totalListings">0</span></div>
        <div class="stat-card">Aktif ilan <span id="activeListings">0</span></div>
      </div>
    </section>

    <section class="listings-card">
      <h2>Bu kullanıcının ilanları</h2>
      <div id="listings"></div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const userId = String(params.get("id") || params.get("userId") || "").trim();

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatPrice(value) {
      return Number(value || 0).toLocaleString("tr-TR") + " TL";
    }

    function readStoredUser() {
      try {
        return JSON.parse(localStorage.getItem("user") || "null");
      } catch (_) {
        return null;
      }
    }

    function getAuthHeaders() {
      const token = String(localStorage.getItem("token") || "").trim();
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    function normalizeUserId(value) {
      if (!value) return "";
      if (typeof value === "string") return value.trim();
      if (typeof value === "object") return String(value._id || value.id || "").trim();
      return "";
    }

    function isListingActive(item) {
      const status = String(item && item.status || "").trim().toLowerCase();
      return Boolean(
        item &&
        item.isDeleted !== true &&
        item.isActive === true &&
        item.approved === true &&
        (status === "approved" || status === "active")
      );
    }

    function renderListing(item) {
      return `
        <div class="listing-item">
          <div>
            <strong>${escapeHtml(item.title || "Başlıksız ilan")}</strong>
            <p>${escapeHtml(item.city || "Şehir yok")} - ${formatPrice(item.price)}</p>
          </div>
          <a href="/listing-detail.html?id=${item._id}">Görüntüle</a>
        </div>
      `;
    }

    function renderProfile(user, listings) {
      const safeListings = Array.isArray(listings) ? listings : [];
      const totalListings = Number(user && user.totalListings != null ? user.totalListings : safeListings.length);
      const activeListings = Number(
        user && user.activeListings != null
          ? user.activeListings
          : safeListings.filter((item) => isListingActive(item)).length
      );

      document.getElementById("profileName").innerText = user && user.name ? user.name : "Jetle Kullanıcısı";
      document.getElementById("profileEmail").innerText = user && user.email ? user.email : "";
      document.getElementById("totalListings").innerText = totalListings;
      document.getElementById("activeListings").innerText = activeListings;
      document.getElementById("listings").innerHTML = safeListings.length
        ? safeListings.map(renderListing).join("")
        : `<div class="empty">Bu kullanıcının yayında ilanı yok.</div>`;
    }

    async function loadPrivateProfile() {
      const headers = getAuthHeaders();
      const userRes = await fetch(`/api/users/${userId}`, { headers });
      if (!userRes.ok) throw new Error("Kullanıcı bilgisi alınamadı");
      const user = await userRes.json();

      const listingsRes = await fetch(`/api/users/${userId}/listings`, { headers });
      if (!listingsRes.ok) throw new Error("İlanlar alınamadı");
      const listings = await listingsRes.json();

      renderProfile(user, listings);
    }

    async function loadPublicProfile() {
      const listingsRes = await fetch("/api/listings");
      if (!listingsRes.ok) throw new Error("İlanlar alınamadı");

      const allListings = await listingsRes.json();
      const listings = (Array.isArray(allListings) ? allListings : []).filter((item) => {
        return normalizeUserId(item && item.user) === userId;
      });
      const firstListing = listings[0] || {};
      const sellerUser = firstListing.user && typeof firstListing.user === "object" ? firstListing.user : null;

      renderProfile({
        name: sellerUser && sellerUser.name ? sellerUser.name : "Jetle Kullanıcısı",
        email: sellerUser && sellerUser.email ? sellerUser.email : "",
        totalListings: listings.length,
        activeListings: listings.filter((item) => isListingActive(item)).length
      }, listings);
    }

    async function loadProfile() {
      if (!userId) {
        document.querySelector(".page").innerHTML = `<div class="empty">Kullanıcı bulunamadı.</div>`;
        return;
      }

      const storedUser = readStoredUser();
      const storedUserId = normalizeUserId(storedUser && (storedUser._id || storedUser.id));
      if (storedUserId && storedUserId === userId) {
        await loadPrivateProfile();
        return;
      }

      await loadPublicProfile();
    }

    loadProfile().catch((err) => {
      document.querySelector(".page").innerHTML = `<div class="empty">${escapeHtml(err && err.message ? err.message : "Bir hata oluştu.")}</div>`;
    });
  </script>
  <script src="/auth-global.js"></script>
</body>
</html>
