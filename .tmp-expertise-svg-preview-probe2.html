<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekspertiz SVG Preview</title>
<style>
body{margin:0;padding:28px;background:#eef3f9;font-family:Inter,Arial,sans-serif}.frame{max-width:1180px;margin:0 auto;background:#fff;border:1px solid #dbe4f0;border-radius:18px;padding:18px;box-shadow:0 16px 40px rgba(15,23,42,.08)}.preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.preview-head h2{margin:0;font-size:18px;color:#0f172a}.preview-head span{font-size:11px;font-weight:700;color:#64748b}.expertise-showcase{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:start}.expertise-showcase-board{border:1px solid #e2e8f0;border-radius:18px;background:linear-gradient(180deg,#fff 0%,#f8fafc 100%);box-shadow:0 14px 36px rgba(15,23,42,.055);padding:8px}.expertise-showcase-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.expertise-showcase-head h4{margin:0;color:#0f172a;font-size:14px;font-weight:850}.expertise-showcase-note{color:#6b7280;font-size:8px;font-weight:700;white-space:nowrap}.expertise-showcase-canvas{position:relative;border-radius:14px;padding:4px;background:radial-gradient(circle at 50% 15%, rgba(255,255,255,.98) 0%, rgba(248,250,252,.96) 44%, rgba(241,245,249,.92) 100%),linear-gradient(180deg, rgba(255,255,255,.94) 0%, rgba(248,250,252,.96) 100%);overflow:hidden}.expertise-showcase-canvas::before{content:"";position:absolute;inset:4px;border:1px solid rgba(226,232,240,.9);border-radius:12px;pointer-events:none}.expertise-showcase-svg{display:block;width:100%;max-width:100%;height:auto;margin:0 auto}.vehicle-shadow{fill:rgba(148,163,184,.12)}.vehicle-outline{fill:#dbe4ee;stroke:rgba(148,163,184,.35);stroke-width:1.5}.vehicle-cabin{fill:rgba(255,255,255,.72);stroke:rgba(148,163,184,.28);stroke-width:1.2}.wheel{fill:#334155}.wheel-inner{fill:#1f2937}.expertise-svg-part{fill:#e5e7eb;stroke:rgba(148,163,184,.38);stroke-width:1.4}.expertise-svg-part.is-original{fill:#dcfce7;stroke:#86efac}.expertise-svg-part.is-local{fill:url(#expertiseLocalPattern);stroke:#facc15}.expertise-svg-part.is-painted{fill:#fde68a;stroke:#facc15}.expertise-svg-part.is-changed{fill:#fecaca;stroke:#ef4444}.expertise-svg-label{fill:#334155;font-size:9px;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.expertise-showcase-legend{display:grid;gap:4px;align-content:start;max-width:92px}.expertise-showcase-card{background:#fff;border:1px solid #e2e8f0;border-radius:9px;padding:6px;box-shadow:0 8px 22px rgba(15,23,42,.045)}.expertise-showcase-card h4{margin:0 0 8px;font-size:9px;color:#0f172a;font-weight:800}.expertise-showcase-legend-list{display:grid;gap:5px}.expertise-showcase-legend-item{display:flex;align-items:center;gap:5px;font-size:8px;color:#334155;font-weight:700}.expertise-showcase-swatch{width:9px;height:9px;border-radius:4px;border:1px solid rgba(148,163,184,.35);flex:0 0 auto}.expertise-showcase-swatch.is-original{background:#22c55e;border-color:#16a34a}.expertise-showcase-swatch.is-local{background:repeating-linear-gradient(-45deg,#fde68a 0 5px,#facc15 5px 10px);border-color:#ca8a04}.expertise-showcase-swatch.is-painted{background:#facc15;border-color:#ca8a04}.expertise-showcase-swatch.is-changed{background:#ef4444;border-color:#dc2626}
</style>
</head>
<body>
<div class="frame">
  <div class="preview-head"><h2>Ekspertiz SVG Preview</h2><span>Ölçek büyütülmüş</span></div>
  <div class="expertise-showcase">
    <div class="expertise-showcase-board">
      <div class="expertise-showcase-head"><h4>Araç Üst Görünüş Ekspertiz</h4><span class="expertise-showcase-note">Zoom</span></div>
      <div class="expertise-showcase-canvas">
        <svg class="expertise-showcase-svg" viewBox="120 0 660 400" role="img" aria-label="Araç üst görünüş ekspertiz şeması">
          <defs><pattern id="expertiseLocalPattern" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fde68a"></rect><rect width="4" height="12" fill="#facc15"></rect></pattern></defs>
          <ellipse class="vehicle-shadow" cx="450" cy="200" rx="340" ry="164"></ellipse>
          <path class="vehicle-outline" d="M170 88 L235 36 H665 L730 88 L760 150 V250 L730 312 L665 364 H235 L170 312 L140 250 V150 Z"></path>
          <rect class="vehicle-cabin" x="376" y="112" width="148" height="170" rx="34" ry="34"></rect>
          <rect class="wheel" x="146" y="108" width="34" height="82" rx="16"></rect><rect class="wheel" x="146" y="210" width="34" height="82" rx="16"></rect><rect class="wheel" x="720" y="108" width="34" height="82" rx="16"></rect><rect class="wheel" x="720" y="210" width="34" height="82" rx="16"></rect><rect class="wheel-inner" x="154" y="118" width="18" height="62" rx="9"></rect><rect class="wheel-inner" x="154" y="220" width="18" height="62" rx="9"></rect><rect class="wheel-inner" x="728" y="118" width="18" height="62" rx="9"></rect><rect class="wheel-inner" x="728" y="220" width="18" height="62" rx="9"></rect>
          <g id="front_bumper"><g class="expertise-svg-part is-original"><rect x="255" y="20" width="390" height="28" rx="14" ry="14"/></g><text class="expertise-svg-label" x="450" y="34">Ön tampon</text></g>
          <g id="hood"><g class="expertise-svg-part is-painted"><rect x="389" y="56" width="122" height="48" rx="12" ry="12"/></g><text class="expertise-svg-label" x="450" y="80">Kaput</text></g>
          <g id="left_front_fender"><g class="expertise-svg-part is-original"><rect x="200" y="50" width="150" height="64" rx="16" ry="16"/></g><text class="expertise-svg-label" x="275" y="82">Sol ön çamurluk</text></g>
          <g id="right_front_fender"><g class="expertise-svg-part is-changed"><rect x="550" y="50" width="150" height="64" rx="16" ry="16"/></g><text class="expertise-svg-label" x="625" y="82">Sağ ön çamurluk</text></g>
          <g id="left_front_door"><g class="expertise-svg-part is-original"><rect x="208" y="122" width="140" height="74" rx="12" ry="12"/></g><text class="expertise-svg-label" x="278" y="159">Sol ön kapı</text></g>
          <g id="right_front_door"><g class="expertise-svg-part is-painted"><rect x="552" y="122" width="140" height="74" rx="12" ry="12"/></g><text class="expertise-svg-label" x="622" y="159">Sağ ön kapı</text></g>
          <g id="left_rear_door"><g class="expertise-svg-part is-original"><rect x="208" y="204" width="140" height="74" rx="12" ry="12"/></g><text class="expertise-svg-label" x="278" y="241">Sol arka kapı</text></g>
          <g id="right_rear_door"><g class="expertise-svg-part is-local"><rect x="552" y="204" width="140" height="74" rx="12" ry="12"/></g><text class="expertise-svg-label" x="622" y="241">Sağ arka kapı</text></g>
          <g id="roof"><g class="expertise-svg-part is-original"><rect x="410" y="122" width="80" height="156" rx="16" ry="16"/></g><text class="expertise-svg-label" x="450" y="200">Tavan</text></g>
          <g id="left_rear_fender"><g class="expertise-svg-part is-painted"><rect x="200" y="286" width="150" height="64" rx="16" ry="16"/></g><text class="expertise-svg-label" x="275" y="318">Sol arka çamurluk</text></g>
          <g id="right_rear_fender"><g class="expertise-svg-part is-original"><rect x="550" y="286" width="150" height="64" rx="16" ry="16"/></g><text class="expertise-svg-label" x="625" y="318">Sağ arka çamurluk</text></g>
          <g id="trunk"><g class="expertise-svg-part is-original"><rect x="389" y="292" width="122" height="48" rx="12" ry="12"/></g><text class="expertise-svg-label" x="450" y="316">Bagaj</text></g>
          <g id="rear_bumper"><g class="expertise-svg-part is-changed"><rect x="255" y="350" width="390" height="28" rx="14" ry="14"/></g><text class="expertise-svg-label" x="450" y="364">Arka tampon</text></g>
        </svg>
      </div>
    </div>
    <div class="expertise-showcase-legend"><div class="expertise-showcase-card"><h4>Durum Açıklaması</h4><div class="expertise-showcase-legend-list"><div class="expertise-showcase-legend-item"><span class="expertise-showcase-swatch is-original"></span><span>Orijinal</span></div><div class="expertise-showcase-legend-item"><span class="expertise-showcase-swatch is-local"></span><span>Lokal</span></div><div class="expertise-showcase-legend-item"><span class="expertise-showcase-swatch is-painted"></span><span>Boyalı</span></div><div class="expertise-showcase-legend-item"><span class="expertise-showcase-swatch is-changed"></span><span>Değişen</span></div></div></div></div>
  </div>
</div>
<script>window.addEventListener("load",()=>{const panel=document.querySelector(".expertise-showcase-board")||document.querySelector(".expertise-panel")||document.querySelector(".expertise-shell"); const canvas=document.querySelector(".expertise-showcase-canvas")||document.querySelector(".expertise-canvas"); const svg=document.querySelector(".expertise-showcase-svg")||document.querySelector(".expertise-svg"); const outline=document.querySelector(".vehicle-outline"); const info={panel:panel?{w:panel.getBoundingClientRect().width,h:panel.getBoundingClientRect().height}:null,canvas:canvas?{w:canvas.getBoundingClientRect().width,h:canvas.getBoundingClientRect().height}:null,svg:svg?{w:svg.getBoundingClientRect().width,h:svg.getBoundingClientRect().height}:null,outline:outline?outline.getBBox():null}; const ratio=(info.outline&&info.panel)?{widthPct:(info.outline.width/info.panel.w*100).toFixed(1),heightPct:(info.outline.height/info.panel.h*100).toFixed(1)}:null; document.title=JSON.stringify({kind:"preview",panel:info.panel,canvas:info.canvas,svg:info.svg,outline:info.outline,ratio});});</script></body>
</html>
